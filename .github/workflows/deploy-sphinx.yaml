name: Deploy Sphinx to GitHub Pages

on:
  push:
    branches:
      - main
      - development

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  pages:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - id: deployment
        uses: sphinx-notes/pages@v3
        with:
          documentation_path: docs
